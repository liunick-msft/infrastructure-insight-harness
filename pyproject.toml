[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "infrastructure-insight-harness"
version = "0.1.0"
description = "Policy-constrained infrastructure evidence collection and validation"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["infrastructure", "network-automation", "evidence", "ssh", "mcp"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Networking",
]
dependencies = [
    "netmiko>=4.6,<5",
    "pydantic>=2.12,<3",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
mcp = [
    "mcp>=2.0,<3",
]
dev = [
    "build>=1.3,<2",
    "mcp>=2.0,<3",
    "pytest>=8.4,<10",
    "pytest-cov>=7,<8",
]

[project.scripts]
infrastructure-insight = "infrastructure_insight.cli:main"
infrastructure-insight-mcp = "infrastructure_insight.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
infrastructure_insight = ["defaults/*.yaml"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
